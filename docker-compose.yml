services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: blytz_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend Services
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - JWT_SECRET=your-secret-key
      - BETTER_AUTH_SECRET=your-better-auth-secret
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8085
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8086
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  auction-service:
    build:
      context: ./services/auction-service
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8087
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8088
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8089
      - STRIPE_SECRET_KEY=sk_test_example
      - STRIPE_WEBHOOK_SECRET=whsec_example
      - FIUU_MERCHANT_ID=example_merchant
      - FIUU_VERIFY_KEY=example_verify_key
      - FIUU_SANDBOX=true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8090
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  logistics-service:
    build:
      context: ./services/logistics-service
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8091
      - NINJAVAN_API_KEY=example_api_key
      - NINJAVAN_API_SECRET=example_api_secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    ports:
      - "8094:8094"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8094
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # API Gateway
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8092:8092"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8092
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      auction-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      logistics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # LiveKit Service
  livekit-service:
    build:
      context: ./services/livekit-service
      dockerfile: Dockerfile
    ports:
      - "8093:8093"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecret
      - LIVEKIT_URL=https://blytz-live-u5u72ozx.livekit.cloud
      - AUTH_SERVICE_URL=http://auth-service:8085
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8093
    depends_on:
      auth-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8092
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: blytz-network
