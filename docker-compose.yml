services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: blytz_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_secure_redis_password_here_32_characters_minimum} --maxmemory 512mb --maxmemory-policy allkeys-lru --maxclients 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-your_secure_redis_password_here_32_characters_minimum}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Backend Services
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db?sslmode=disable&max_conns=50&max_idle_conns=25
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_secure_redis_password_here_32_characters_minimum}
      - JWT_SECRET=${JWT_SECRET:-your_super_secure_256_bit_jwt_secret_key_for_production_only_32_bytes_plus}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-your_super_secure_256_bit_better_auth_secret_key_for_production_only_32_bytes_plus}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8085
      - DB_MAX_OPEN_CONNS=50
      - DB_MAX_IDLE_CONNS=25
      - DB_CONN_MAX_LIFETIME=300s
      - DB_CONN_MAX_IDLE_TIME=60s
      - REDIS_POOL_SIZE=50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8086
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  auction-service:
    build:
      context: ./services/auction-service
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db?sslmode=disable&max_conns=50&max_idle_conns=25
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_secure_redis_password_here_32_characters_minimum}
      - JWT_SECRET=${JWT_SECRET:-your_super_secure_256_bit_jwt_secret_key_for_production_only_32_bytes_plus}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8087
      - DB_MAX_OPEN_CONNS=50
      - DB_MAX_IDLE_CONNS=25
      - DB_CONN_MAX_LIFETIME=300s
      - DB_CONN_MAX_IDLE_TIME=60s
      - REDIS_POOL_SIZE=50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.75'
        reservations:
          memory: 192M
          cpus: '0.375'

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8088
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8089
      - STRIPE_SECRET_KEY=sk_test_example
      - STRIPE_WEBHOOK_SECRET=whsec_example
      - FIUU_MERCHANT_ID=example_merchant
      - FIUU_VERIFY_KEY=example_verify_key
      - FIUU_SANDBOX=true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db?sslmode=disable&max_conns=50&max_idle_conns=25
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_secure_redis_password_here_32_characters_minimum}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8090
      - DB_MAX_OPEN_CONNS=50
      - DB_MAX_IDLE_CONNS=25
      - DB_CONN_MAX_LIFETIME=300s
      - DB_CONN_MAX_IDLE_TIME=60s
      - REDIS_POOL_SIZE=50
      - WS_READ_BUFFER_SIZE=4096
      - WS_WRITE_BUFFER_SIZE=4096
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  logistics-service:
    build:
      context: ./services/logistics-service
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8091
      - NINJAVAN_API_KEY=example_api_key
      - NINJAVAN_API_SECRET=example_api_secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Search Service
  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db?sslmode=disable&max_conns=50&max_idle_conns=25
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_secure_redis_password_here_32_characters_minimum}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8095
      - DB_MAX_OPEN_CONNS=50
      - DB_MAX_IDLE_CONNS=25
      - DB_CONN_MAX_LIFETIME=300s
      - DB_CONN_MAX_IDLE_TIME=60s
      - REDIS_POOL_SIZE=50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.75'
        reservations:
          memory: 192M
          cpus: '0.375'

  # Notification Service
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    ports:
      - "8094:8094"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db?sslmode=disable&max_conns=50&max_idle_conns=25
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_secure_redis_password_here_32_characters_minimum}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8094
      - DB_MAX_OPEN_CONNS=50
      - DB_MAX_IDLE_CONNS=25
      - DB_CONN_MAX_LIFETIME=300s
      - DB_CONN_MAX_IDLE_TIME=60s
      - REDIS_POOL_SIZE=50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.75'
        reservations:
          memory: 192M
          cpus: '0.375'

  # API Gateway
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8092:8092"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8092
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      auction-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      logistics-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # LiveKit Service
  livekit-service:
    build:
      context: ./services/livekit-service
      dockerfile: Dockerfile
    ports:
      - "8093:8093"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecret
      - LIVEKIT_URL=https://blytz-live-u5u72ozx.livekit.cloud
      - AUTH_SERVICE_URL=http://auth-service:8085
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8093
    depends_on:
      auth-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://gateway:8092
        - NEXT_PUBLIC_WS_URL=ws://gateway:8092
        - NODE_ENV=production
        - MODE=remote
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:8092
      - NEXT_PUBLIC_WS_URL=ws://gateway:8092
      - NODE_ENV=production
      - MODE=remote
      - NEXT_PUBLIC_ENABLE_ANALYTICS=false
      - NEXT_PUBLIC_ENABLE_DEBUG=false
      - NEXT_PUBLIC_FIUU_SANDBOX=true
      - NEXT_PUBLIC_LIVEKIT_URL=wss://blytz-live-u5u72ozx.livekit.cloud
    depends_on:
      gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      auction-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - blytz-network

  # Monitoring Services
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - blytz-network

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    networks:
      - blytz-network

  alertmanager:
    image: prom/alertmanager:v0.26.0
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - blytz-network

  node-exporter:
    image: prom/node-exporter:v1.6.0
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    networks:
      - blytz-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - blytz-network

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - blytz-network

  promtail:
    image: grafana/promtail:2.9.0
    ports:
      - "9080:9080"
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - blytz-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:

networks:
  default:
    name: blytz-network
    driver: bridge
