version: '3.8'

# Modular Frontend Deployment for 2C8GB VPS
# Separates frontend from backend for easier management

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8085
        - NODE_ENV=production
        - MODE=mock
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8085
      - NODE_ENV=production
      - MODE=mock
      - NEXT_PUBLIC_ENABLE_ANALYTICS=false
      - NEXT_PUBLIC_ENABLE_DEBUG=false
      - NODE_OPTIONS=--max-old-space-size=64
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.25'
        reservations:
          memory: 96M
          cpus: '0.125'
    restart: unless-stopped
    networks:
      - blytz-network