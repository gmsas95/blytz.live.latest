version: '3.8'

services:
  # Database Services (reduced memory)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: blytz_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_secure_redis_password_here_32_characters_minimum} --maxmemory 256mb --maxmemory-policy allkeys-lru --maxclients 5000
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-your_secure_redis_password_here_32_characters_minimum}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.125'

  # Core Services (reduced resources)
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db?sslmode=disable&max_conns=20&max_idle_conns=10
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_secure_redis_password_here_32_characters_minimum}
      - JWT_SECRET=${JWT_SECRET:-your_super_secure_256_bit_jwt_secret_key_for_production_only_32_bytes_plus}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-your_super_secure_256_bit_better_auth_secret_key_for_production_only_32_bytes_plus}
      - ENVIRONMENT=production
      - LOG_LEVEL=warn
      - PORT=8085
      - DB_MAX_OPEN_CONNS=20
      - DB_MAX_IDLE_CONNS=10
      - DB_CONN_MAX_LIFETIME=300s
      - DB_CONN_MAX_IDLE_TIME=60s
      - REDIS_POOL_SIZE=20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.3'
        reservations:
          memory: 96M
          cpus: '0.15'

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db
      - ENVIRONMENT=production
      - LOG_LEVEL=warn
      - PORT=8086
      - DB_MAX_OPEN_CONNS=20
      - DB_MAX_IDLE_CONNS=10
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.3'
        reservations:
          memory: 96M
          cpus: '0.15'

  # Frontend (optimized build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://gateway:8092
        - NEXT_PUBLIC_WS_URL=ws://gateway:8092
        - NODE_ENV=production
        - MODE=mock
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:8092
      - NEXT_PUBLIC_WS_URL=ws://gateway:8092
      - NODE_ENV=production
      - MODE=mock
      - NEXT_PUBLIC_ENABLE_ANALYTICS=false
      - NEXT_PUBLIC_ENABLE_DEBUG=false
      - NEXT_PUBLIC_FIUU_SANDBOX=true
      - NODE_OPTIONS=--max-old-space-size=256
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # API Gateway (reduced resources)
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8092:8092"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=warn
      - PORT=8092
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.15'

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge