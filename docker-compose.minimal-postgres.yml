version: '3.8'

# Ultra-minimal PostgreSQL for 2C8GB VPS
# Optimized for RAM usage, not storage

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: blytz_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # PostgreSQL memory optimizations
      POSTGRES_SHARED_PRELOAD_LIBRARIES: 'on'
      POSTGRES_SHARED_BUFFERS: '16MB'
      POSTGRES_WORK_MEM: '1MB'
      POSTGRES_MAINTENANCE_WORK_MEM: '8MB'
      POSTGRES_EFFECTIVE_CACHE_SIZE: '32MB'
      # Connection limits to reduce RAM
      POSTGRES_MAX_CONNECTIONS: '10'
      POSTGRES_MAX_PREPARED_TRANSACTIONS: '0'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=16MB
      -c work_mem=1MB
      -c maintenance_work_mem=8MB
      -c effective_cache_size=32MB
      -c max_connections=10
      -c checkpoint_completion_target=0.7
      -c wal_buffers=4MB
      -c random_page_cost=1.1
    deploy:
      resources:
        limits:
          memory: 128M  # Only 128MB RAM
          cpus: '0.2'
        reservations:
          memory: 64M   # Reserved RAM
          cpus: '0.1'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blytz_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend in mock mode
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8085
        - NODE_ENV=production
        - MODE=mock
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8085
      - NODE_ENV=production
      - MODE=mock
      - NEXT_PUBLIC_ENABLE_ANALYTICS=false
      - NEXT_PUBLIC_ENABLE_DEBUG=false
      - NODE_OPTIONS=--max-old-space-size=96
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.25'
        reservations:
          memory: 96M
          cpus: '0.125'
    restart: unless-stopped

volumes:
  postgres_data: