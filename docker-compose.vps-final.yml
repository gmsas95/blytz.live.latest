version: '3.8'

# Final VPS-optimized Docker Compose for 2C8GB VPS
# Clean, focused, and ready for deployment

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: blytz_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # PostgreSQL memory optimizations for VPS
      POSTGRES_SHARED_PRELOAD_LIBRARIES: 'on'
      POSTGRES_SHARED_BUFFERS: '8MB'
      POSTGRES_WORK_MEM: '1MB'
      POSTGRES_MAINTENANCE_WORK_MEM: '4MB'
      POSTGRES_EFFECTIVE_CACHE_SIZE: '16MB'
      # Connection limits for VPS
      POSTGRES_MAX_CONNECTIONS: '10'
      POSTGRES_MAX_PREPARED_TRANSACTIONS: '0'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=8MB
      -c work_mem=1MB
      -c maintenance_work_mem=4MB
      -c effective_cache_size=16MB
      -c max_connections=10
      -c checkpoint_completion_target=0.7
      -c wal_buffers=2MB
      -c random_page_cost=1.1
    deploy:
      resources:
        limits:
          memory: 128M  # Only 128MB RAM
          cpus: '0.2'
        reservations:
          memory: 64M   # Reserved RAM
          cpus: '0.1'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blytz_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8085
        - NODE_ENV=production
        - MODE=mock
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8085
      - NODE_ENV=production
      - MODE=mock
      - NEXT_PUBLIC_ENABLE_ANALYTICS=false
      - NEXT_PUBLIC_ENABLE_DEBUG=false
      - NODE_OPTIONS=--max-old-space-size=64
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.25'
        reservations:
          memory: 96M
          cpus: '0.125'
    restart: unless-stopped
    depends_on:
      - postgres

  auth-service:
    image: gmsas95/blytz-live-services:auth-service
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db?sslmode=disable&max_conns=5&max_idle_conns=2
      - ENVIRONMENT=production
      - LOG_LEVEL=error
      - PORT=8085
      - JWT_SECRET=vps_jwt_secret_minimum_32_bytes
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

  product-service:
    image: gmsas95/blytz-live-services:product-service
    ports:
      - "8086:8086"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db?sslmode=disable
      - ENVIRONMENT=production
      - LOG_LEVEL=error
      - PORT=8086
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

volumes:
  postgres_data: