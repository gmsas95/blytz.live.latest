  gateway:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    ports:
      - "8092:8092"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=error
      - PORT=8092
      - AUTH_SERVICE_URL=http://auth-service:8085
      - PRODUCT_SERVICE_URL=http://product-service:8086
      - AUCTION_SERVICE_URL=http://auction-service:8087
      - ORDER_SERVICE_URL=http://order-service:8088
      - PAYMENT_SERVICE_URL=http://payment-service:8089
      - LOGISTICS_SERVICE_URL=http://logistics-service:8091
      - CHAT_SERVICE_URL=http://chat-service:8090
      - SEARCH_SERVICE_URL=http://search-service:8095
      - NOTIFICATION_SERVICE_URL=http://notification-service:8094
      - JWT_SECRET=gateway_jwt_secret_minimum_32_bytes
    depends_on:
      - auth-service
      - product-service
      - auction-service
      - order-service
      - payment-service
      - chat-service
      - logistics-service
      - search-service
      - notification-service
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.15'
    restart: unless-stopped

