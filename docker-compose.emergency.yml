version: '3.8'

# Emergency minimal deployment for 2C8GB VPS
# Only essential services with minimal resource usage

services:
  # Essential Database (minimal)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: blytz_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.125'
    restart: unless-stopped

  # Essential Frontend (mock mode only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8085
        - NEXT_PUBLIC_WS_URL=ws://localhost:8085
        - NODE_ENV=production
        - MODE=mock
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8085
      - NEXT_PUBLIC_WS_URL=ws://localhost:8085
      - NODE_ENV=production
      - MODE=mock
      - NEXT_PUBLIC_ENABLE_ANALYTICS=false
      - NEXT_PUBLIC_ENABLE_DEBUG=false
      - NODE_OPTIONS=--max-old-space-size=128
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.125'
    restart: unless-stopped

  # Optional: Single backend service if needed
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blytz_db?sslmode=disable&max_conns=10&max_idle_conns=5
      - ENVIRONMENT=production
      - LOG_LEVEL=error
      - PORT=8085
      - DB_MAX_OPEN_CONNS=10
      - DB_MAX_IDLE_CONNS=5
      - JWT_SECRET=emergency_jwt_secret_key_32_bytes_minimum
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

volumes:
  postgres_data:

# Remove all networks to save memory