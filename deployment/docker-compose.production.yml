version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: blytz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blytz_prod
      POSTGRES_USER: blytz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blytz -d blytz_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blytz-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: blytz-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru --maxclients 10000
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - blytz-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: blytz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
    depends_on:
      - gateway
    networks:
      - blytz-network

  # Gateway Service
  gateway:
    build:
      context: ../
      dockerfile: services/gateway/Dockerfile
    container_name: blytz-gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://blytz.app,https://www.blytz.app}
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blytz-network

  # Auth Service
  auth-service:
    build:
      context: ../
      dockerfile: services/auth-service/Dockerfile
    container_name: blytz-auth
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8085
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blytz-network

  # Auction Service
  auction-service:
    build:
      context: ../
      dockerfile: services/auction-service/Dockerfile
    container_name: blytz-auction
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8087
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blytz-network

  # Product Service
  product-service:
    build:
      context: ../
      dockerfile: services/product-service/Dockerfile
    container_name: blytz-product
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8086
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blytz-network

  # Chat Service
  chat-service:
    build:
      context: ../
      dockerfile: services/chat-service/Dockerfile
    container_name: blytz-chat
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8090
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blytz-network

  # Order Service
  order-service:
    build:
      context: ../
      dockerfile: services/order-service/Dockerfile
    container_name: blytz-order
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8088
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blytz-network

  # Payment Service
  payment-service:
    build:
      context: ../
      dockerfile: services/stripe-service/Dockerfile
    container_name: blytz-payment
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8089
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blytz-network

  # Notification Service
  notification-service:
    build:
      context: ../
      dockerfile: services/notification-service/Dockerfile
    container_name: blytz-notification
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8094
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
    ports:
      - "8094:8094"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blytz-network

  # LiveKit Service
  livekit-service:
    build:
      context: ../
      dockerfile: services/livekit-service/Dockerfile
    container_name: blytz-livekit
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8093
      - JWT_SECRET=${JWT_SECRET}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    ports:
      - "8093:8093"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blytz-network

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  blytz-network:
    driver: bridge